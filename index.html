<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Temel SEO Başlık ve Açıklaması -->
    <title>Cihaz Arıza & Hata Kodu Rehberi | Kombi, Çamaşır Makinesi ve Klima Çözümleri</title>
    <meta name="description" content="Kombi, klima ve beyaz eşyalardaki hata kodlarının anlamları ve servis çağırmadan önce evde uygulayabileceğiniz adım adım pratik çözüm rehberi.">
    <meta name="keywords" content="kombi hata kodları, f5 arızası, e15 arızası, çamaşır makinesi hata kodları, klima arıza çözümleri, arıza rehberi">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ariza-rehberi.vercel.app/">

    <!-- Sosyal Medya ve Paylaşım Önizlemeleri (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ariza-rehberi.vercel.app/">
    <meta property="og:title" content="Cihaz Arıza & Hata Kodu Rehberi">
    <meta property="og:description" content="Kombi, klima ve beyaz eşyalardaki arıza kodlarını anında bulun, adım adım çözümü uygulayın.">

    <style>
        :root {
            --bg-base: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(56, 189, 248, 0.15);
            --card-border-hover: rgba(56, 189, 248, 0.45);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: linear-gradient(135deg, #0284c7, #2563eb);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 3rem 1.25rem;
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 10% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 820px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.85rem;
        }

        h1 {
            margin: 0 0 0.65rem 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 580px;
            line-height: 1.5;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.05rem 1.2rem 1.05rem 3rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(18, 25, 38, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 8px 30px rgba(0, 0, 0, 0.4);
            background: rgba(22, 32, 50, 0.95);
        }

        .category-tabs {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 0.55rem 1.15rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #090d16;
            font-weight: 700;
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.5rem;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3), 0 0 20px rgba(56, 189, 248, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.85rem;
        }

        .code-badge {
            background: var(--badge-bg);
            color: #fff;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .device-info {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .issue-title {
            margin: 0 0 0.75rem 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .steps-label {
            margin: 0.75rem 0 0.4rem 0;
            font-weight: 700;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        ul.solution-steps {
            margin: 0;
            padding-left: 1.25rem;
            color: #cbd5e1;
            font-size: 0.93rem;
            line-height: 1.6;
        }

        ul.solution-steps li {
            margin-bottom: 0.35rem;
        }

        details {
            margin-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 0.75rem;
        }

        summary {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
        }

        summary:hover {
            color: #7dd3fc;
        }

        .details-content {
            padding: 0.65rem 0.25rem 0 0.25rem;
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .no-result {
            text-align: center;
            color: var(--text-muted);
            padding: 3.5rem 1.5rem;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="hero-badge">⚡ Servis Öncesi Kontrol Aracı</div>
        <h1>Arıza & Hata Kodu Rehberi</h1>
        <p class="subtitle">Kombi, klima veya beyaz eşyanızdaki kodu aratın, adımları uygulayarak çözümü evde deneyin.</p>
    </header>

    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Örn: F5, E18, Demirdöküm, Su akıtıyor..." autofocus>
    </div>

    <div class="category-tabs">
        <button class="tab-btn active" data-cat="all">Tümü</button>
        <button class="tab-btn" data-cat="kombi">🔥 Kombiler</button>
        <button class="tab-btn" data-cat="beyazesya">🧺 Çamaşır / Bulaşık</button>
        <button class="tab-btn" data-cat="klima">❄️ Klimalar</button>
    </div>

    <div class="results" id="resultsContainer"></div>
</div>

<script>
const errorDatabase = [
    {
        code: "F5 / E05",
        brand: "Baymak / Demirdöküm",
        category: "kombi",
        title: "Hava Akış / Prosestat Hatası",
        steps: [
            "Kombinin bacasının yerinden çıkıp çıkmadığını kontrol edin.",
            "Bacanın dışarıdaki çıkış ağzının kar, buz veya kuş yuvası ile tıkanmadığından emin olun.",
            "Cihazı şalterinden kapatıp 1 dakika sonra tekrar açın (Resetleyin)."
        ],
        details: "Sorun devam ederse prosestat (hava basınç anahtarı) veya fan motorunda elektriksel/mekanik arıza olabilir."
    },
    {
        code: "E01 / A01 / F28",
        brand: "Baymak / E.C.A / Vaillant",
        category: "kombi",
        title: "Ateşleme Başarısızlığı (Gaz Yokluğu)",
        steps: [
            "Evdeki gaz vanalarının açık olduğunu kontrol edin (ocağı yakmayı deneyin).",
            "Kombinin yanında bulunan gaz vanasının boruyla paralel hizada (açık) olduğunu doğrulayın.",
            "Kombi panelindeki Reset (R) tuşuna 3 saniye basarak yeniden başlatın (3 kez deneyin)."
        ],
        details: "Gaz valfi bobin arızası veya iyonizasyon elektrodunun kirlenmesi/işlevini yitirmesi durumunda servis müdahalesi gerekir."
    },
    {
        code: "F10 / E03",
        brand: "Demirdöküm / Baymak",
        category: "kombi",
        title: "Düşük Su Basıncı Hatası",
        steps: [
            "Kombinin alt kısmındaki doldurma musluğunu sola çevirerek açın.",
            "Ön paneldeki basınç göstergesi 1.5 bar değerine gelene kadar su basın.",
            "Musluğu iyice sıkıp kapatın. Cihaz otomatik olarak çalışmaya başlayacaktır."
        ],
        details: "Basınç sürekli düşüyorsa tesisatta su kaçağı veya kombinin genleşme tankında membran patlağı olabilir."
    },
    {
        code: "F1 / E02",
        brand: "Demirdöküm / Baymak",
        category: "kombi",
        title: "Aşırı Isınma / Limit Termostat Hatası",
        steps: [
            "Radyatör (petek) vanalarının en az 2-3 tanesinin tamamen açık olduğunu kontrol edin.",
            "Kombiyi kapatıp su sıcaklığının düşmesi için 15-20 dakika bekleyin.",
            "Reset tuşuna basarak cihazı tekrar çalıştırın."
        ],
        details: "Sirkülasyon pompası sıkışmış, ana eşanjör kireç bağlamış veya kalorifer dönüş filtresi tıkanmış olabilir."
    },
    {
        code: "F22 / F75",
        brand: "Vaillant",
        category: "kombi",
        title: "Yetersiz Su Basıncı veya Pompa Algılama Sorunu",
        steps: [
            "Basınç göstergesini kontrol edin; 1 bar altındaysa alt vanadan 1.5 bara kadar su ekleyin.",
            "Kombiyi kapatıp açarak pompanın devreye girip girmediğini dinleyin.",
            "Peteklerin havasını hava alma anahtarı ile tahliye edin."
        ],
        details: "F75 hatası özellikle su basınç sensörünün tıkanması veya sirkülasyon pompasının devir alamamasından kaynaklanır."
    },
    {
        code: "EA / CE",
        brand: "Bosch Condens",
        category: "kombi",
        title: "Alev Algılanmadı / Düşük Tesisat Basıncı",
        steps: [
            "Gaz giriş vanasının açık olduğundan emin olun.",
            "Su basıncı 1 bar altındaysa alt musluktan 1.5 bara yükseltin.",
            "Reset butonuna basılı tutarak cihazı yeniden başlatın."
        ],
        details: "Ateşleme elektrotlarında karbon birikmesi veya elektronik anakart alev devresi arızası görülebilir."
    },
    {
        code: "E08 / F08",
        brand: "Arçelik / Beko Çamaşır",
        category: "beyazesya",
        title: "Su Boşaltma Hatası (Tahliye Problemi)",
        steps: [
            "Makinenin sağ alt köşesindeki tahliye filtre kapağını açın.",
            "Filtreyi sola çevirerek çıkarın, yabancı cisimleri (bozuk para, toka) temizleyin.",
            "Gider hortumunun ezilmediğinden veya tıkanmadığından emin olun."
        ],
        details: "Tahliye motorunun pervanesi sıkışmış veya motor bobini yanmış olabilir."
    },
    {
        code: "E18 / F18",
        brand: "Bosch / Siemens Çamaşır",
        category: "beyazesya",
        title: "Pompa Tıkalı / Su Tahliye Edilemiyor",
        steps: [
            "Sağ alttaki küçük tahliye hortumundan kovaya suyu akıtın.",
            "Pompa kapağını dikkatlice açıp tamburdan gelen yabancı cisimleri temizleyin.",
            "Programı 'Sıkma/Tahliye' konumuna alarak yeniden başlatın."
        ],
        details: "Pompa filtresi temizlenmesine rağmen boşaltmıyorsa manyetik tahliye motoru arızalıdır."
    },
    {
        code: "E15",
        brand: "Bosch / Siemens Bulaşık",
        category: "beyazesya",
        title: "Tabanda Su Kaçağı (Su Güvenlik Kilidi)",
        steps: [
            "Cihazın fişini prizden çekin ve su musluğunu kapatın.",
            "Makineyi öne doğru yaklaşık 45 derece eğerek alt haznedeki suyu bezle akıtın.",
            "Cihazı tamamen kurulayıp 2 saat bekledikten sonra tekrar fişe takın."
        ],
        details: "Tabandaki taşma emniyet şamandırası devreye girmiştir. Su kaçağı iç hortumlardan kaynaklanıyor olabilir."
    },
    {
        code: "E01 / Kapı Kilidi",
        brand: "Arçelik / Beko Çamaşır",
        category: "beyazesya",
        title: "Kapak Kilitlenmeme Hatası",
        steps: [
            "Kapağı biraz sertçe bastırarak dilin yuvaya tam oturduğundan emin olun.",
            "Kapak mandalını ve kilit tırnağını kontrol edin.",
            "Cihazın fişini prizden çekip 2 dakika bekledikten sonra tekrar takın."
        ],
        details: "Elektronik kapı kilidi (PTC) arızalandığında kart kilit sinyali alamaz."
    },
    {
        code: "4C / 4E",
        brand: "Samsung Çamaşır",
        category: "beyazesya",
        title: "Su Girişi / Su Alma Hatası",
        steps: [
            "Makinenin bağlı olduğu su musluğunun açık olduğunu kontrol edin.",
            "Arkadaki su giriş hortumunu söküp tel filtreyi fırça ile kireçten temizleyin.",
            "Evin genel şebeke su basıncının yeterli olduğundan emin olun."
        ],
        details: "Ventil bobini arızalandığında elektrik gitse dahi su vanasını açamaz."
    },
    {
        code: "CH05 / E1",
        brand: "LG / Beko Klima",
        category: "klima",
        title: "İç - Dış Ünite Haberleşme Hatası",
        steps: [
            "Klimanın bağlı olduğu sigortayı indirin.",
            "En az 3 dakika bekledikten sonra sigortayı tekrar kaldırın.",
            "Kumandadan klimayı tekrar çalıştırın."
        ],
        details: "Üniteler arası sinyal kablosundaki kopukluk veya dış ünite inverter kartı arızasından kaynaklanır."
    },
    {
        code: "U4 / A6",
        brand: "Daikin Klima",
        category: "klima",
        title: "İletişim Hatası veya İç Fan Kilitlenmesi",
        steps: [
            "Ön kapağı açıp filtreleri yıkayarak temizleyin.",
            "Cihazın ana şalterini kapatıp 5 dakika bekleyin ve yeniden açın.",
            "Kumanda üzerinden arıza kodunu resetleyin."
        ],
        details: "İç ünite fan motorunun rulmanları kilitlenmiş veya anakart devresi arızalanmış olabilir."
    }
];

const searchInput = document.getElementById('searchInput');
const resultsContainer = document.getElementById('resultsContainer');
const tabButtons = document.querySelectorAll('.tab-btn');

let activeCategory = 'all';

function renderCards(data) {
    resultsContainer.innerHTML = '';
    
    if (data.length === 0) {
        resultsContainer.innerHTML = '<div class="no-result">🔍 Aradığınız kriterlere uygun bir kayıt bulunamadı.<br><small style="margin-top:8px; display:inline-block; color:#64748b;">Yalnızca hata kodunu (örn: F5) veya cihaz markasını yazmayı deneyin.</small></div>';
        return;
    }

    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <span class="code-badge">${item.code}</span>
                <span class="device-info">${item.brand}</span>
            </div>
            <h3 class="issue-title">${item.title}</h3>
            <div class="steps-label">Ne Yapılmalı?</div>
            <ul class="solution-steps">
                ${item.steps.map(step => `<li>${step}</li>`).join('')}
            </ul>
            <details>
                <summary>▶ 🔧 Servis & Parça İpuçları</summary>
                <div class="details-content">${item.details}</div>
            </details>
        `;
        resultsContainer.appendChild(card);
    });
}

function filterData() {
    const query = searchInput.value.toLowerCase().trim();
    
    const filtered = errorDatabase.filter(item => {
        const matchesCategory = (activeCategory === 'all' || item.category === activeCategory);
        const matchesQuery = item.code.toLowerCase().includes(query) ||
                             item.brand.toLowerCase().includes(query) ||
                             item.title.toLowerCase().includes(query) ||
                             item.details.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
    });

    renderCards(filtered);
}

searchInput.addEventListener('input', filterData);

tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        filterData();
    });
});

renderCards(errorDatabase);
</script>

</body>
</html>
