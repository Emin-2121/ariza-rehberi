function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function copyToClipboard(text, successMsg) {
    navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg);
    });
}

        const card = document.createElement('div');
        card.className = 'card';
        card.id = item.id;

        const currentUrl = `${window.location.origin}${window.location.pathname}#${item.id}`;
        const waText = encodeURIComponent(`*${item.brand} - ${item.code} Hatası (${item.title})*\nÇözüm Rehberi ve Kontrol Adımları için tıkla: ${currentUrl}`);
        const waUrl = `https://api.whatsapp.com/send?text=${waText}`;

        const technicianText = `Cihaz: ${item.brand}\nHata Kodu: ${item.code}\nArıza Tanımı: ${item.title}\nKullanıcı Kontrolü: Evdeki standart reset/temizleme adımları uygulandı, problem devam ediyor.`;

        // Checklist HTML
        const stepsHtml = item.steps.map((step, idx) => `
            <label class="step-item">
                <input type="checkbox" onchange="this.parentElement.classList.toggle('checked', this.checked)">
                <span class="step-text">${step}</span>
            </label>
        `).join('');

        card.innerHTML = `
            <div class="card-header">
                <span class="code-badge">${item.code}</span>
                <span class="device-info">${item.brand}</span>
            </div>
            <h3 class="issue-title">${item.title}</h3>
            
            <div class="steps-label">Uygulanacak Adımlar (İşaretleyin)</div>
            <div class="step-list">
                ${stepsHtml}
            </div>

            <details>
                <summary>▶ 🔧 Servis & Parça İpuçları</summary>
                <div class="details-content">${item.details}</div>
            </details>

            <div class="card-actions">
                <a href="${waUrl}" target="_blank" class="action-btn whatsapp">
                    💬 WhatsApp'ta Paylaş
                </a>
                <button class="action-btn" onclick="copyToClipboard('${currentUrl}', '🔗 Doğrudan kart linki kopyalandı!')">
                    🔗 Linki Kopyala
                </button>
                <button class="action-btn" onclick='copyToClipboard(${JSON.stringify(technicianText)}, "📋 Servis arıza notu panoya kopyalandı!")'>
                    📝 Usta / Servis Notu Al
                </button>
            </div>
        `;
        resultsContainer.appendChild(card);
    });
}

function filterData() {
    const query = searchInput.value.toLowerCase().trim();
    
    const filtered = errorDatabase.filter(item => {
        const matchesCategory = (activeCategory === 'all' || item.category === activeCategory);
        const matchesQuery = item.code.toLowerCase().includes(query) ||
                             item.brand.toLowerCase().includes(query) ||
                             item.title.toLowerCase().includes(query) ||
                             item.details.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
    });

    renderCards(filtered);
}

searchInput.addEventListener('input', filterData);

tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        filterData();
    });
});

// Sayfa ilk yüklendiğinde çalıştır
renderCards(errorDatabase);

// URL'de doğrudan bir ID varsa oraya odaklan (#f5-e05 gibi)
window.addEventListener('DOMContentLoaded', () => {
    if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 200);
        }
    }
});
</script>
