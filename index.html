<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cihaz Arıza & Hata Kodu Rehberi</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 2.5rem 1rem;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      color: var(--accent);
      font-size: 2rem;
      font-weight: 700;
    }
    p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }
    .search-box {
      margin-bottom: 1rem;
    }
    input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.15s ease;
    }
    .card:hover {
      border-color: #475569;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .badge {
      background: #0284c7;
      color: white;
      font-weight: bold;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .brand {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .issue-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: #e2e8f0;
    }
    .steps {
      margin: 0.5rem 0 1rem 1.2rem;
      padding: 0;
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .action-panel {
      border-top: 1px solid #334155;
      padding-top: 0.75rem;
    }
    details summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 500;
      user-select: none;
    }
    .action-content {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.8rem;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Arıza & Hata Kodu Rehberi</h1>
      <p>Kombi, klima veya beyaz eşyanızdaki hata kodunu aratın, anında çözümü uygulayın.</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Örn: E01, F5, Baymak, Su akıtıyor...">
    </div>

    <div class="filters" id="filterContainer">
      <button class="filter-btn active" data-category="all">Tümü</button>
      <button class="filter-btn" data-category="kombi">🔥 Kombiler</button>
      <button class="filter-btn" data-category="beyaz-esya">🧺 Çamaşır / Bulaşık</button>
      <button class="filter-btn" data-category="klima">❄️ Klimalar</button>
    </div>

    <div class="results" id="resultsList"></div>
  </div>

  <script>
    const errorDatabase = [
      {
        category: "kombi",
        brand: "Baymak / Demirdöküm",
        code: "F5 / E05",
        title: "Hava Akış / Prosestat Hatası",
        solution: [
          "Bacanın yerinden çıkıp çıkmadığını veya tıkalı olup olmadığını kontrol edin.",
          "Cihazı şalterinden kapatıp 30 saniye sonra tekrar açarak resetleyin.",
          "Sorun devam ediyorsa prosestat veya fan motoru arızalı olabilir."
        ],
        actionNote: "💡 Gerekli Parça / Servis İpucu: Fan motoru tozdan sıkışmış olabilir veya prosestat silikon hortumunda yoğuşma suyu birikmiş olabilir. Servis öncesi bacanın dış ağzını kontrol edin."
      },
      {
        category: "kombi",
        brand: "Demirdöküm / E.C.A.",
        code: "F1 / E01",
        title: "Ateşleme Başarısızlığı (Gaz Yokluğu)",
        solution: [
          "Dairedeki diğer gazlı cihazları (ocak vb.) açarak daireye gaz geldiğinden emin olun.",
          "Kombinin altındaki sarı gaz vanasının boruyla aynı hizada (açık) olduğunu kontrol edin.",
          "Kombi panelindeki 'R' (Reset) tuşuna 3 saniye basılı tutarak cihazı sıfırlayın."
        ],
        actionNote: "💡 Sıfırlama İpucu: Reset işlemini en fazla 3 kez tekrarlayın. Gaz gelmesine rağmen ateşleme yoksa iyonizasyon elektrodu veya gaz valfi arızalı olabilir."
      },
      {
        category: "kombi",
        brand: "Bosch / Buderus",
        code: "E9 / 2.8 Bar",
        title: "Düşük Su Basıncı / Aşırı Isınma",
        solution: [
          "Kombinin altındaki su doldurma musluğunu saat yönünün tersine yavaşça çevirin.",
          "Basınç manometresi 1.5 bar seviyesine gelene kadar su basın.",
          "Musluğu iyice kapatın ve cihaz panelinden resetleyin."
        ],
        actionNote: "💡 Gerekli Parça İpucu: Su doldurulduktan kısa süre sonra basınç tekrar sıfıra iniyorsa tesisatta kaçak veya genleşme tankı membranı patlamış olabilir."
      },
      {
        category: "kombi",
        brand: "Vaillant",
        code: "F.28 / F.29",
        title: "Ateşleme Başarısızlığı & Gaz Besleme Hatası",
        solution: [
          "Gaz sayacının vanasının ve kombi altındaki gaz vanasının açık olduğunu teyit edin.",
          "Kombi üzerindeki alev işaretli reset düğmesine basın.",
          "Kış aylarında dış sayaç regülatörünün donup donmadığını kontrol edin."
        ],
        actionNote: "💡 Servis Rehberi: F.28 ilk ateşleme hatasıdır; F.29 ise çalışma sırasında alevin kopmasıdır. Gaz armatürü veya ateşleme trafosu kontrol edilmelidir."
      },
      {
        category: "kombi",
        brand: "Vaillant",
        code: "F.22",
        title: "Yetersiz Su Basıncı (Kuru Yanma Riski)",
        solution: [
          "Kombinin altındaki doldurma musluğu yardımıyla su ekleyin.",
          "Dijital ekranda basınç değerinin 1.2 - 1.5 bar aralığına gelmesini sağlayın.",
          "İşlem sonrası vanayı sıkıca kapatın."
        ],
        actionNote: "💡 İpucu: Basınç normal olduğu halde F.22 devam ediyorsa su basınç sensörü tıkanmış veya arızalanmış olabilir."
      },
      {
        category: "kombi",
        brand: "Ferroli",
        code: "A01",
        title: "Brülör Ateşleme Hatası",
        solution: [
          "Gaz vanasının açık olduğunu ve gaz akışı olduğunu kontrol edin.",
          "Cihaz panelindeki reset düğmesine basın.",
          "Kombinin elektrik faz-nötr bağlantısının ters olup olmadığını kontrol ettirin."
        ],
        actionNote: "💡 Teknik İpucu: Ferroli modellerinde faz-nötr tersliği alev algılama elektrodunun sinyal üretmesini engelleyebilir."
      },
      {
        category: "kombi",
        brand: "Ferroli",
        code: "F37",
        title: "Tesisat Su Basıncı Düşük",
        solution: [
          "Kombinin altındaki doldurma musluğunu açarak su takviyesi yapın.",
          "Göstergeyi 1.5 bar değerine getirin ve musluğu kapatın.",
          "Cihaz otomatik devreye girmezse açma/kapama düğmesinden kapatıp açın."
        ],
        actionNote: "💡 Parça İpucu: Doldurma musluğu bozulduysa su almayabilir; parça değişimi gereklidir."
      },
      {
        category: "kombi",
        brand: "E.C.A. Proteus / Confeo",
        code: "E03 / E3",
        title: "Aşırı Sıcaklık Kilitlenmesi (Limit Termostat)",
        solution: [
          "Kombiyi kapatıp 15 dakika petek ve su sıcaklığının düşmesini bekleyin.",
          "Peteklerin en az 2-3 tanesinin vanasının tam açık olduğundan emin olun.",
          "Cihaz soğuduktan sonra resetleyin."
        ],
        actionNote: "💡 Servis İpucu: Sirkülasyon pompası sıkışmışsa sıcak suyu peteklere itemez ve limit termostatı attırır."
      },
      {
        category: "beyaz-esya",
        brand: "Arçelik / Beko Çamaşır",
        code: "E08 / F08",
        title: "Su Boşaltma Hatası (Tahliye Problemi)",
        solution: [
          "Makinenin sağ alt köşesindeki tahliye filtre kapağını açın.",
          "Filtreyi sola çevirerek çıkarın, yabancı cisimleri temizleyin.",
          "Gider hortumunun ezilmediğinden emin olun."
        ],
        actionNote: "💡 Parça İpucu: Filtre temiz olmasına rağmen suyu atmıyorsa pompa motoru arızalı olabilir."
      },
      {
        category: "beyaz-esya",
        brand: "Arçelik / Beko Çamaşır",
        code: "E01 / Kapı Kilidi",
        title: "Kapak Kilitlenmeme Hatası",
        solution: [
          "Kapağı tam bastırarak mandalın yerine oturduğundan emin olun.",
          "Kapak mandalını kontrol edin.",
          "Cihazın fişini çekip 2 dakika sonra tekrar takın."
        ],
        actionNote: "💡 Parça Değişimi: Sorun devam ediyorsa emniyet kilit mekanizması arızalıdır."
      },
      {
        category: "beyaz-esya",
        brand: "Samsung Çamaşır",
        code: "4C / 4E",
        title: "Su Girişi / Su Alma Hatası",
        solution: [
          "Su musluğunun açık olduğunu kontrol edin.",
          "Giriş hortumundaki tel filtreyi kireçten temizleyin.",
          "Şebeke su basıncının yeterli olduğundan emin olun."
        ],
        actionNote: "💡 Parça İpucu: Su giriş ventili (solenoid valf) kontrol edilmelidir."
      },
      {
        category: "beyaz-esya",
        brand: "Samsung Çamaşır",
        code: "5C / 5E / dC",
        title: "Tahliye Problemi veya Dengesiz Yük",
        solution: [
          "5C/5E için tahliye filtresini temizleyin.",
          "dC/Ub hatasında ise tambur içindeki çamaşırları elinizle dengeleyip sıkmayı yeniden başlatın."
        ],
        actionNote: "💡 Servis İpucu: Tek parça ağır ürün yıkanırken cihaz balansı sağlayamaz."
      },
      {
        category: "beyaz-esya",
        brand: "Vestel / Regal Çamaşır",
        code: "E04",
        title: "Sürekli Su Alma / Su Seviye Hatası",
        solution: [
          "Cihazı prizden çekip tahliye moduna alarak suyu boşaltın.",
          "Cihazı kapatıp tekrar açın."
        ],
        actionNote: "💡 Servis İpucu: Su ventili açık kalmış veya prosestat hortumu delinmiş olabilir."
      },
      {
        category: "beyaz-esya",
        brand: "Bosch / Siemens Bulaşık",
        code: "E15",
        title: "Taban Tepsisinde Su Kaçağı (Aquastop Devrede)",
        solution: [
          "Cihazın fişini çekin.",
          "Makineyi öne doğru 45 derece eğerek tabandaki suyu boşaltın.",
          "Kuruduktan sonra tekrar takıp deneyin."
        ],
        actionNote: "💡 Arıza Tespiti: İç kısımdaki sızıntı onarılmazsa arıza birkaç yıkamada tekrarlar."
      },
      {
        category: "beyaz-esya",
        brand: "Bosch / Siemens Bulaşık",
        code: "E22 / E24",
        title: "Filtre Tıkanıklığı / Boşaltma Pompası Kilitli",
        solution: [
          "Tabandaki mikro filtreyi çıkarıp temizleyin.",
          "Filtre altındaki pompa pervanesinde yabancı cisim olup olmadığını kontrol edin."
        ],
        actionNote: "💡 İpucu: Pompa kapağı yerine tam oturmazsa E24 hatası verir."
      },
      {
        category: "klima",
        brand: "Mitsubishi / Daikin / Arçelik",
        code: "CH05 / E5",
        title: "İç-Dış Ünite İletişim Hatası",
        solution: [
          "Klimanın sigortasını indirin ve 2 dakika bekleyin.",
          "Sigortayı kaldırıp cihazı yeniden başlatın."
        ],
        actionNote: "💡 Servis İpucu: Voltaj dalgalanmalarında inverter kart korumaya geçer."
      },
      {
        category: "klima",
        brand: "Beko / Arçelik Klima",
        code: "CH01 / CH02",
        title: "İç Ünite Sıcaklık / Boru Sensör Hatası",
        solution: [
          "Ön kapağı kaldırıp toz filtrelerini yıkayın.",
          "Cihazı şalterden kapatıp 5 dakika sonra açın."
        ],
        actionNote: "💡 Parça İpucu: NTC ortam veya boru sensörünün ölçümü yapılmalıdır."
      }
    ];

    let currentCategory = "all";
    const searchInput = document.getElementById("searchInput");
    const resultsList = document.getElementById("resultsList");
    const filterButtons = document.querySelectorAll(".filter-btn");

    function renderErrors() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = errorDatabase.filter(item => {
        const matchesCategory = (currentCategory === "all") || (item.category === currentCategory);
        const matchesQuery = item.brand.toLowerCase().includes(query) ||
                             item.code.toLowerCase().includes(query) ||
                             item.title.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        resultsList.innerHTML = '<div class="empty-state">Aradığınız kriterlere uygun hata kodu bulunamadı.</div>';
        return;
      }

      resultsList.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-header">
            <span class="badge">${item.code}</span>
            <span class="brand">${item.brand}</span>
          </div>
          <div class="issue-title">${item.title}</div>
          <strong>Ne Yapılmalı?</strong>
          <ul class="steps">
            ${item.solution.map(step => `<li>${step}</li>`).join("")}
          </ul>
          <div class="action-panel">
            <details>
              <summary>🔧 Servis / Parça Rehberi & İpuçları</summary>
              <div class="action-content">
                ${item.actionNote}
              </div>
            </details>
          </div>
        </div>
      `).join("");
    }

    searchInput.addEventListener("input", renderErrors);

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderErrors();
      });
    });

    renderErrors();
  </script>
</body>
</html>
