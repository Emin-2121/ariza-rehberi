<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Temel SEO Başlık ve Açıklaması -->
    <title>Cihaz Arıza & Hata Kodu Rehberi | Kombi, Çamaşır Makinesi ve Klima Çözümleri</title>
    <meta name="description" content="Kombi, klima ve beyaz eşyalardaki hata kodlarının anlamları ve servis çağırmadan önce evde uygulayabileceğiniz adım adım pratik çözüm rehberi.">
    <meta name="keywords" content="kombi hata kodları, f5 arızası, e15 arızası, çamaşır makinesi hata kodları, klima arıza çözümleri, arıza rehberi">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ariza-rehberi.vercel.app/">

    <!-- Sosyal Medya ve Paylaşım Önizlemeleri (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ariza-rehberi.vercel.app/">
    <meta property="og:title" content="Cihaz Arıza & Hata Kodu Rehberi">
    <meta property="og:description" content="Kombi, klima ve beyaz eşyalardaki arıza kodlarını anında bulun, adım adım çözümü uygulayın.">

    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 2.5rem 1rem;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            color: var(--accent);
            font-size: 1.85rem;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 1.25rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .category-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            border-color: var(--accent);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.25rem;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .code-badge {
            background: #0284c7;
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .device-info {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .issue-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .steps-label {
            margin: 0.5rem 0 0.25rem 0;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        ul.solution-steps {
            margin: 0;
            padding-left: 1.2rem;
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        details {
            margin-top: 0.85rem;
            border-top: 1px solid #334155;
            padding-top: 0.5rem;
        }

        summary {
            font-size: 0.85rem;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
        }

        .details-content {
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .no-result {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Arıza & Hata Kodu Rehberi</h1>
        <p class="subtitle">Kombi, klima veya beyaz eşyanızdaki hata kodunu aratın, anında çözümü uygulayın.</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Örn: E01, F5, Baymak, Su akıtıyor..." autofocus>
    </div>

    <div class="category-tabs">
        <button class="tab-btn active" data-cat="all">Tümü</button>
        <button class="tab-btn" data-cat="kombi">🔥 Kombiler</button>
        <button class="tab-btn" data-cat="beyazesya">🧺 Çamaşır / Bulaşık</button>
        <button class="tab-btn" data-cat="klima">❄️ Klimalar</button>
    </div>

    <div class="results" id="resultsContainer"></div>
</div>

<script>
const errorDatabase = [
    {
        code: "F5 / E05",
        brand: "Baymak / Demirdöküm",
        category: "kombi",
        title: "Hava Akış / Prosestat Hatası",
        steps: [
            "Kombinin bacasının yerinden çıkıp çıkmadığını kontrol edin.",
            "Bacanın dışarıdaki çıkış ağzının kar, buz veya kuş yuvası ile tıkanmadığından emin olun.",
            "Cihazı şalterinden kapatıp 1 dakika sonra tekrar açın (Resetleyin)."
        ],
        details: "Sorun devam ederse prosestat (hava basınç anahtarı) veya fan motorunda elektriksel/mekanik arıza olabilir."
    },
    {
        code: "E01 / A01 / F28",
        brand: "Baymak / E.C.A / Vaillant",
        category: "kombi",
        title: "Ateşleme Başarısızlığı (Gaz Yokluğu)",
        steps: [
            "Evdeki gaz vanalarının açık olduğunu kontrol edin (örneğin ocağı yakmayı deneyin).",
            "Kombinin yanında bulunan gaz vanasının boruyla paralel hizada (açık) olduğunu doğrulayın.",
            "Kombi panelindeki Reset (R) tuşuna 3 saniye basarak yeniden başlatın (3 kez deneyin)."
        ],
        details: "Gaz valfi bobin arızası veya iyonizasyon elektrodunun kirlenmesi/işlevini yitirmesi durumunda servis müdahalesi gerekir."
    },
    {
        code: "F10 / E03",
        brand: "Demirdöküm / Baymak",
        category: "kombi",
        title: "Düşük Su Basıncı Hatası",
        steps: [
            "Kombinin alt kısmındaki doldurma musluğunu (genellikle mavi veya siyah) sola çevirerek açın.",
            "Ön paneldeki basınç göstergesi (barometre) 1.5 bar değerine gelene kadar su basın.",
            "Musluğu iyice sıkıp kapatın. Cihaz otomatik olarak çalışmaya başlayacaktır."
        ],
        details: "Basınç sürekli düşüyorsa tesisatta su kaçağı veya kombinin genleşme tankında hava eksikliği/membran patlağı olabilir."
    },
    {
        code: "F1 / E02",
        brand: "Demirdöküm / Baymak",
        category: "kombi",
        title: "Aşırı Isınma / Limit Termostat Hatası",
        steps: [
            "Radyatör (petek) vanalarının en az 2-3 tanesinin tamamen açık olduğunu kontrol edin.",
            "Kombiyi kapatıp su sıcaklığının düşmesi için 15-20 dakika bekleyin.",
            "Reset tuşuna basarak cihazı tekrar çalıştırın."
        ],
        details: "Sirkülasyon pompası sıkışmış, ana eşanjör kireç bağlamış veya kalorifer dönüş filtresi tıkanmış olabilir."
    },
    {
        code: "F22 / F75",
        brand: "Vaillant",
        category: "kombi",
        title: "Yetersiz Su Basıncı veya Pompa Basınç Algılama Sorunu",
        steps: [
            "Basınç göstergesini kontrol edin; 1 barın altındaysa alttaki doldurma vanasından 1.5 bara kadar su ekleyin.",
            "Kombiyi kapatıp açarak pompanın devreye girip girmediğini dinleyin.",
            "Peteklerin havasını hava alma anahtarı ile tahliye edin."
        ],
        details: "F75 hatası özellikle su basınç sensörünün tıkanması veya sirkülasyon pompasının devir alamamasından kaynaklanır."
    },
    {
        code: "EA / CE",
        brand: "Bosch Condens",
        category: "kombi",
        title: "Alev Algılanmadı / Düşük Tesisat Basıncı",
        steps: [
            "Gaz giriş vanasının açık olduğundan emin olun.",
            "Su basıncı 1 bar altındaysa alt musluktan 1.5 bara yükseltin.",
            "Reset butonuna göstergedeki işaret kaybolana kadar basılı tutun."
        ],
        details: "Ateşleme elektrotlarında karbon birikmesi veya elektronik anakart alev algılama devresi arızası görülebilir."
    },
    {
        code: "E08 / F08",
        brand: "Arçelik / Beko Çamaşır",
        category: "beyazesya",
        title: "Su Boşaltma Hatası (Tahliye Problemi)",
        steps: [
            "Makinenin sağ alt köşesindeki tahliye filtre kapağını açın.",
            "Filtreyi sola çevirerek çıkarın, yabancı cisimleri (bozuk para, toka vb.) temizleyin.",
            "Gider hortumunun ezilmediğinden veya tıkanmadığından emin olun."
        ],
        details: "Tahliye motorunun pervanesi sıkışmış veya motor bobini yanmış olabilir. Pompa motoru değişimi gerekebilir."
    },
    {
        code: "E18 / F18",
        brand: "Bosch / Siemens Çamaşır",
        category: "beyazesya",
        title: "Pompa Tıkalı / Su Tahliye Edilemiyor",
        steps: [
            "Sağ alttaki küçük tahliye hortumundan kovaya suyu akıtın.",
            "Pompa kapağını dikkatlice açıp tamburdan gelen yabancı cisimleri temizleyin.",
            "Cihazı kapatıp programı 'Sıkma/Tahliye' konumuna alarak yeniden başlatın."
        ],
        details: "Pompa filtresi temizlenmesine rağmen ses geliyor ve boşaltmıyorsa manyetik tahliye motoru arızalıdır."
    },
    {
        code: "E15",
        brand: "Bosch / Siemens Bulaşık",
        category: "beyazesya",
        title: "Tabanda Su Kaçağı (Su Güvenlik Kilidi)",
        steps: [
            "Cihazın fişini prizden çekin ve su musluğunu kapatın.",
            "Makineyi öne doğru yaklaşık 45 derece eğerek alt tabla haznesindeki birikmiş suyu yere bir bezle akıtın.",
            "Cihazı tamamen kurulayıp 2 saat bekledikten sonra tekrar fişe takın."
        ],
        details: "Tabandaki taşma emniyet şamandırası devreye girmiştir. Su kaçağı iç hortumlardan veya kazan contasından kaynaklanıyor olabilir."
    },
    {
        code: "E01 / Kapı Kilidi",
        brand: "Arçelik / Beko Çamaşır",
        category: "beyazesya",
        title: "Kapak Kilitlenmeme Hatası",
        steps: [
            "Kapağı biraz sertçe bastırarak dilin yuvasına tam oturduğundan emin olun.",
            "Kapak mandalını ve kilit tırnağını fiziksel kırılmalara karşı kontrol edin.",
            "Cihazın fişini prizden çekip 2 dakika bekledikten sonra tekrar takın."
        ],
        details: "Elektronik kapı kilit mekanizması (PTC kilit) arızalandığında kart kilit sinyali alamaz ve program başlamaz."
    },
    {
        code: "4C / 4E",
        brand: "Samsung Çamaşır",
        category: "beyazesya",
        title: "Su Girişi / Su Alma Hatası",
        steps: [
            "Makinenin bağlı olduğu su musluğunun açık olduğunu kontrol edin.",
            "Cihazın arkasındaki su giriş hortumunu söküp uçtaki tel filtreyi fırça ile kireçten temizleyin.",
            "Evin genel şebeke su basıncının yeterli olduğundan emin olun."
        ],
        details: "Ventil (su giriş ventili) bobini arızalandığında elektrik gitse dahi vanayı açamaz ve su alamaz."
    },
    {
        code: "CH05 / E1",
        brand: "LG / Beko Klima",
        category: "klima",
        title: "İç - Dış Ünite Haberleşme Hatası",
        steps: [
            "Klimanın bağlı olduğu sigortayı (şalteri) indirin.",
            "En az 3 dakika bekledikten sonra sigortayı tekrar kaldırın.",
            "Kumandadan klimayı tekrar soğutma/ısıtma moduna alın."
        ],
        details: "Üniteler arası sinyal kablosundaki kopukluk, klemens oksitlenmesi veya dış ünite inverter kartı arızasından kaynaklanır."
    },
    {
        code: "U4 / A6",
        brand: "Daikin Klima",
        category: "klima",
        title: "İletişim Hatası veya İç Fan Motoru Kilitlenmesi",
        steps: [
            "Klimanın ön kapağını açıp filtrelerin tozdan tamamen tıkanıp tıkanmadığını kontrol edin ve yıkayın.",
            "Cihazın ana şalterini kapatıp 5 dakika bekleyin ve yeniden açın.",
            "Kumanda üzerinden arıza kodunu resetleyin."
        ],
        details: "İç ünite fan motorunun rulmanları kilitlenmiş veya anakart fan devresi arızalanmış olabilir."
    }
];

const searchInput = document.getElementById('searchInput');
const resultsContainer = document.getElementById('resultsContainer');
const tabButtons = document.querySelectorAll('.tab-btn');

let activeCategory = 'all';

function renderCards(data) {
    resultsContainer.innerHTML = '';
    
    if (data.length === 0) {
        resultsContainer.innerHTML = '<div class="no-result">Aradığınız kriterlere uygun bir arıza kaydı bulunamadı. Lütfen sadece kodu (örneğin F5) veya cihaz markasını yazmayı deneyin.</div>';
        return;
    }

    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <span class="code-badge">${item.code}</span>
                <span class="device-info">${item.brand}</span>
            </div>
            <h3 class="issue-title">${item.title}</h3>
            <div class="steps-label">Ne Yapılmalı?</div>
            <ul class="solution-steps">
                ${item.steps.map(step => `<li>${step}</li>`).join('')}
            </ul>
            <details>
                <summary>▶ 🔧 Servis / Parça Rehberi & İpuçları</summary>
                <div class="details-content">${item.details}</div>
            </details>
        `;
        resultsContainer.appendChild(card);
    });
}

function filterData() {
    const query = searchInput.value.toLowerCase().trim();
    
    const filtered = errorDatabase.filter(item => {
        const matchesCategory = (activeCategory === 'all' || item.category === activeCategory);
        const matchesQuery = item.code.toLowerCase().includes(query) ||
                             item.brand.toLowerCase().includes(query) ||
                             item.title.toLowerCase().includes(query) ||
                             item.details.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
    });

    renderCards(filtered);
}

searchInput.addEventListener('input', filterData);

tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        filterData();
    });
});

// İlk çalıştırma
renderCards(errorDatabase);
</script>

</body>
</html>
